[project]
name = "savr-back"
version = "0.0.0"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# Ruff — lint + format (`make lint`, `make fmt`)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*", ".venv", "venv", "staticfiles", "media"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = [
    "E501",   # longueur de ligne : gérée par le formatter (chaînes longues tolérées)
    "E402",   # imports tardifs volontaires (settings, nest_asyncio, django.setup)
    "B904",   # raise ... from err : trop de churn pour l'instant
    "B905",   # zip(strict=) : pas de changement de comportement implicite
    "DJ001",  # null=True sur CharField : schéma existant
    "DJ008",  # __str__ manquant : non bloquant
    "DJ012",  # ordre des membres de modèle : cosmétique
    "UP031",  # %-format : style historique
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["B011"]
"conftest.py" = ["B011"]
# Espaces de fin dans les prompts LLM (chaînes multi-lignes) : ne pas altérer les prompts.
"recipes/services/ai_service.py" = ["W291"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "appversion", "chat", "core", "emails", "recipes", "savr_back", "stats"]

# ---------------------------------------------------------------------------
# Pytest — voir Makefile (`make test`, `make test-all`, `make test-domain d=...`)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "savr_back.settings_test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["accounts", "appversion", "chat", "recipes", "emails", "core", "stats"]
# Les commandes de gestion `test_*.py` ne sont pas des tests.
norecursedirs = [".git", ".venv", "venv", "management", "migrations", "embedding", "node_modules"]
addopts = [
    "--reuse-db",
    "--strict-markers",
    "-m", "not slow",
]
markers = [
    "slow: tests lents (exclus par défaut, inclus par `make test-all`)",
    "integration: traverse plusieurs couches (API + services + tâches)",
    "auth: inscription / login / JWT / access gate / entitlements",
    "mealplan: planning, créneaux, invitations repas",
    "posts: publication et feed social",
    "shopping: listes de courses",
    "dietary: allergies / goûts / conflits",
    "chat: agent conversationnel et outils",
    "imports: import URL / génération IA de recettes",
    "recipes: recettes, collections, recherche",
    "appversion: contrôle de version de l'app (version-check, blocage 426)",
    "stats: stats cuisiné, badges, Récap, classification ingrédients/cuisines",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
